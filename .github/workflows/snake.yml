name: Contribution snake

# Draws the contribution graph as a snake (light and dark) and publishes the
# SVGs to the `output` branch, which the README reads. Runs daily and on demand;
# uses only this repo's GITHUB_TOKEN, so no third-party service can go down.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#3f6212&color_dots=#ebedf0,#d9f99d,#a3e635,#65a30d,#3f6212
            dist/snake-dark.svg?palette=github-dark&color_snake=#a3e635&color_dots=#161b22,#1a2e05,#3f6212,#65a30d,#a3e635

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
